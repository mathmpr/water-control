services:
  server:
    build:
      context: ./server
    container_name: water-control-server
    restart: unless-stopped
    environment:
      DB_CLIENT: mysql2
      DB_HOST: ${DB_HOST:?Configure o host MySQL externo}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-water_control}
      DB_USERNAME: ${DB_USERNAME:?Configure o usuario MySQL}
      DB_PASSWORD: ${DB_PASSWORD:?Configure a senha MySQL}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      SECRET_KEY: ${SECRET_KEY:-change-this-device-secret}
      IAM: server
      TZ: America/Sao_Paulo
    ports:
      - "1883:1883"
      - "1888:1888"
    volumes:
      - water-control-data:/data
      - water-control-uploads:/app/public/uploads

volumes:
  water-control-data:
  water-control-uploads:
