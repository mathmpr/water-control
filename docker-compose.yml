services:
  server:
    build:
      context: ./server
    container_name: water-control-server
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/dev.sqlite3
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      SECRET_KEY: ${SECRET_KEY:-change-this-device-secret}
      IAM: server
      TZ: America/Sao_Paulo
    ports:
      - "1883:1883"
      - "1888:1888"
    volumes:
      - water-control-data:/data
      - water-control-uploads:/app/public/uploads

volumes:
  water-control-data:
  water-control-uploads:
